name: Publish
run-name: Publish Repository Actions 🛫
on:
  release:
    types:
      - published
    branches:
      - master
      - 'release/**'
  workflow_run:
    workflows:
      - Release OBS-Studio-Rust
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: obs-studio-rust-v* release to offer in the update feed (default the latest)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  check-tag:
    name: Check Release Tag
    if: github.repository_owner == 'obsproject'
    runs-on: ubuntu-26.04
    outputs:
      validTag: ${{ steps.check.outputs.validTag }}
      flatpakMatrix: ${{ steps.check.outputs.flatpakMatrix }}
      updateChannel: ${{ steps.check.outputs.updateChannel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          set-safe-directory: ${{ env.GITHUB_WORKSPACE }}

      - name: Check Release Tag ☑️
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              lastPreRelease="$(gh release list --exclude-drafts --limit 10 --json "publishedAt,tagName,isPrerelease" \
                --jq '[.[] | select(.isPrerelease == true)] | first | .tagName')"
              currentRelease="${GITHUB_REF_NAME}"
              isPreReleaseAhead=false

              printf '%s\n%s\n' "${currentRelease}" "${lastPreRelease}" | sort --version-sort --reverse --check=quiet &&
                isPreReleaseAhead=false || isPreReleaseAhead=true

              # Edge case: Sort considers the non-suffixed version older than a suffixed one
              if ${isPreReleaseAhead} && [[ "${currentRelease}" == "${lastPreRelease//-*}" ]]; then
                isPreReleaseAhead=false
              fi

              echo 'validTag=true' >> $GITHUB_OUTPUT
              if ! ${isPreReleaseAhead}; then
                echo 'flatpakMatrix=["beta", "stable"]' >> $GITHUB_OUTPUT
              else
                echo 'flatpakMatrix=["stable"]' >> $GITHUB_OUTPUT
              fi
              echo 'updateChannel=stable' >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'flatpakMatrix=["beta"]' >> $GITHUB_OUTPUT
              echo 'updateChannel=beta' >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

  flatpak-publish:
    name: Flathub 📦
    needs: check-tag
    if: github.repository_owner == 'obsproject' && fromJSON(needs.check-tag.outputs.validTag)
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    env:
      FLATPAK_BUILD_SHARE_PATH: flatpak_app/files/share
      TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
      RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
      RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
      YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
      YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
      YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
      YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /opt/hostedtoolcache/CodeQL:/to_clean/codeql
        - /usr/local/.ghcup:/to_clean/ghcup
        - /opt/hostedtoolcache/Python:/to_clean/python
        - /usr/share/swift:/to_clean/swift
        - /usr/share/dotnet:/to_clean/dotnet
    strategy:
      matrix:
        branch: ${{ fromJSON(needs.check-tag.outputs.flatpakMatrix) }}
    steps:
      - name: Prepare build space
        shell: bash
        run: |
          : Prepare build space

          echo ::group::Available storage
          df -h
          echo ::endgroup::

          echo ::group::Remove Android stuff
          rm -rf /to_clean/android/*
          echo ::endgroup::

          echo ::group::Remove CodeQL stuff
          rm -rf /to_clean/codeql/*
          echo ::endgroup::

          echo ::group::Remove GHCup stuff
          rm -rf /to_clean/ghcup/*
          echo ::endgroup::

          echo ::group::Remove Python stuff
          rm -rf /to_clean/python/*
          echo ::endgroup::

          echo ::group::Remove Swift stuff
          rm -rf /to_clean/swift/*
          echo ::endgroup::

          echo ::group::Remove .NET stuff
          rm -rf /to_clean/dotnet/*
          echo ::endgroup::

          echo ::group::Available storage
          df -h
          echo ::endgroup::

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          set-safe-directory: ${{ env.GITHUB_WORKSPACE }}

      - name: Set Up Environment 🔧
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          cache_key='flatpak-builder-${{ hashFiles('build-aux/com.obsproject.Studio.json') }}'
          cache_ref='master'
          read -r id key size unit created accessed <<< \
            "$(gh cache list --ref "refs/heads/${cache_ref}" --key "${cache_key}-x86_64" | head -1)"

          if [[ "${key}" ]]; then
            echo "cacheHit=true" >> $GITHUB_OUTPUT
          else
            echo "cacheHit=false" >> $GITHUB_OUTPUT
          fi

          echo "cacheKey=${cache_key}" >> $GITHUB_OUTPUT
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

      - name: Validate Flatpak manifest
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: manifest
          path: build-aux/com.obsproject.Studio.json

      - name: Build Flatpak Manifest
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          build-bundle: false
          manifest-path: ${{ github.workspace }}/build-aux/com.obsproject.Studio.json
          cache: ${{ fromJSON(steps.setup.outputs.cacheHit) }}
          cache-key: ${{ steps.setup.outputs.cacheKey }}
          mirror-screenshots-url: https://dl.flathub.org/media
          branch: ${{ matrix.branch }}

      - name: Validate AppStream
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: appstream
          path: ${{ env.FLATPAK_BUILD_SHARE_PATH }}/metainfo/com.obsproject.Studio.metainfo.xml

      - name: Verify Icon and Metadata in app-info
        working-directory: ${{ env.FLATPAK_BUILD_SHARE_PATH }}
        run: |
          : Verify Icon and Metadata in app-info
          test -f app-info/icons/flatpak/128x128/com.obsproject.Studio.png || { echo "::error::Missing 128x128 icon in app-info"; exit 1; }
          test -f app-info/xmls/com.obsproject.Studio.xml.gz || { echo "::error::Missing com.obsproject.Studio.xml.gz in app-info"; exit 1; }

      - name: Validate build directory
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: builddir
          path: flatpak_app

      - name: Validate repository
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: repo
          path: repo

      - name: Publish to Flathub Beta
        uses: flatpak/flatpak-github-actions/flat-manager@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        if: ${{ matrix.branch == 'beta' }}
        with:
          flat-manager-url: https://hub.flathub.org/
          repository: beta
          token: ${{ secrets.FLATHUB_BETA_TOKEN }}
          build-log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Publish to Flathub
        uses: flatpak/flatpak-github-actions/flat-manager@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        if: ${{ matrix.branch == 'stable' }}
        with:
          flat-manager-url: https://hub.flathub.org/
          repository: stable
          token: ${{ secrets.FLATHUB_TOKEN }}
          build-log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  steam-upload:
    name: Upload Steam Builds 🚂
    needs: check-tag
    if: github.repository_owner == 'obsproject' && fromJSON(needs.check-tag.outputs.validTag)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/steam-upload
        with:
          steamSecret: ${{ secrets.STEAM_SHARED_SECRET }}
          steamUser: ${{ secrets.STEAM_USER }}
          steamPassword: ${{ secrets.STEAM_PASSWORD }}
          workflowSecret: ${{ github.token }}
          tagName: ${{ github.ref_name }}
          preview: false

  windows-patches:
    name: Create Windows Patches 🩹
    needs: check-tag
    if: github.repository_owner == 'obsproject' && fromJSON(needs.check-tag.outputs.validTag)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/windows-patches
        with:
          tagName: ${{ github.ref_name }}
          workflowSecret: ${{ github.token }}
          channel: ${{ needs.check-tag.outputs.updateChannel }}
          gcsAccessKeyId: ${{ secrets.GCS_ACCESS_KEY_ID }}
          gcsAccessKeySecret: ${{ secrets.GCS_ACCESS_KEY_SECRET }}

  # obs-rust's update feed (#1730). release-rust.yaml publishes releases with
  # GITHUB_TOKEN, which never fires `release: published`, so this job runs when
  # that workflow finishes. It writes the Sparkle appcasts (one per macOS arch)
  # and an RSA-signed branches.json as assets of the fixed `update-feed`
  # release: the stable URLs that CMakePresets.json (SPARKLE_APPCAST_URL),
  # OBSSparkle.mm.hpp and MacUpdateThread.cpp.hpp name. Each enclosure points
  # at the DMG on the tagged release itself. The Windows updater stays off
  # (ENABLE_WIN_UPDATER) until its manifest and patches are published too.
  update-feed:
    name: Publish obs-rust Update Feed 🎙️
    if: >-
      github.repository == 'obs-rust/obs-studio'
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'master'))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    env:
      GH_TOKEN: ${{ github.token }}
      FEED_TAG: update-feed
      FEED_URL: https://github.com/obs-rust/obs-studio/releases/download/update-feed
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Find Release 🔎
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          : Find Release 🔎
          local tag="${INPUT_TAG}"
          if [[ -z ${tag} ]] {
            tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases --limit 30 \
              --json tagName --jq '[.[] | select(.tagName | startswith("obs-studio-rust-v"))] | first | .tagName // ""')"
          }
          if [[ ${tag} != obs-studio-rust-v* ]] {
            print '::notice::No obs-studio-rust release to publish'
            print 'skip=true' >> $GITHUB_OUTPUT
            exit 0
          }
          local current="$(curl -fsSL "${FEED_URL}/updates_arm64_v2.xml" || true)"
          if [[ ${GITHUB_EVENT_NAME} != workflow_dispatch && ${current} == *"/download/${tag}/"* ]] {
            print "::notice::The update feed already offers ${tag}"
            print 'skip=true' >> $GITHUB_OUTPUT
            exit 0
          }
          print "tag=${tag}" >> $GITHUB_OUTPUT
          print 'skip=false' >> $GITHUB_OUTPUT

      - name: Set Up Sparkle ✨
        if: steps.release.outputs.skip == 'false'
        run: |
          : Set Up Sparkle ✨
          local version base_url hash
          IFS=';' read -r version base_url hash <<< \
            "$(jq -r '.configurePresets[] | select(.name=="dependencies")
              | .vendor["obsproject.com/obs-studio"].tools.sparkle | [.version, .baseUrl, .hash] | join(";")' CMakePresets.json)"
          mkdir -p "${RUNNER_TEMP}/Sparkle"
          curl -fsSL -o "${RUNNER_TEMP}/Sparkle.tar.xz" "${base_url}/${version}/Sparkle-${version}.tar.xz"
          local checksum="$(shasum -a 256 "${RUNNER_TEMP}/Sparkle.tar.xz" | cut -d ' ' -f 1)"
          if [[ ${checksum} != ${hash} ]] {
            print "::error::Sparkle-${version}.tar.xz checksum mismatch: ${checksum} (expected: ${hash})"
            exit 2
          }
          tar -xJf "${RUNNER_TEMP}/Sparkle.tar.xz" -C "${RUNNER_TEMP}/Sparkle"

      - name: Generate Appcasts 🎙️
        if: steps.release.outputs.skip == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SPARKLE_KEY: ${{ secrets.OBS_RUST_SPARKLE_PRIVATE_KEY }}
          RSA_KEY: ${{ secrets.OBS_RUST_UPDATE_RSA_PRIVATE_KEY }}
        run: |
          : Generate Appcasts 🎙️
          if [[ -z ${SPARKLE_KEY} || -z ${RSA_KEY} ]] {
            print '::error::OBS_RUST_SPARKLE_PRIVATE_KEY and OBS_RUST_UPDATE_RSA_PRIVATE_KEY must be set'
            exit 2
          }
          local keys="${RUNNER_TEMP}/keys"
          mkdir -m 700 -p "${keys}"
          trap 'rm -rf "${keys}"' EXIT
          print -rn -- "${SPARKLE_KEY}" > "${keys}/sparkle.key"
          print -r -- "${RSA_KEY}" > "${keys}/rsa.pem"

          mkdir -p feed
          local arch
          for arch (arm64 x86_64) {
            mkdir -p "builds/${arch}"
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "*-macos-${arch}.dmg" --dir "builds/${arch}"
            "${RUNNER_TEMP}/Sparkle/bin/generate_appcast" \
              --ed-key-file "${keys}/sparkle.key" \
              --download-url-prefix "https://github.com/obs-rust/obs-studio/releases/download/${TAG}/" \
              --full-release-notes-url "https://github.com/obs-rust/obs-studio/releases/tag/${TAG}" \
              --link 'https://github.com/obs-rust/obs-studio' \
              --maximum-deltas 0 \
              -o "feed/updates_${arch}_v2.xml" \
              "builds/${arch}"
            grep -q "/download/${TAG}/" "feed/updates_${arch}_v2.xml"
            grep -q 'sparkle:edSignature=' "feed/updates_${arch}_v2.xml"
          }

          # Only the default "stable" branch exists; OBSApp always adds it.
          print '[]' > feed/branches.json
          openssl dgst -sha512 -sign "${keys}/rsa.pem" -out feed/branches.json.bin feed/branches.json
          xxd -p feed/branches.json.bin | tr -d '\n' > feed/branches.json.sig
          rm feed/branches.json.bin

      - name: Publish Feed 📡
        if: steps.release.outputs.skip == 'false'
        run: |
          : Publish Feed 📡
          if ! gh release view "${FEED_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${FEED_TAG}" --repo "${GITHUB_REPOSITORY}" --target master --prerelease --latest=false \
              --title 'OBS-Studio-Rust update feed' \
              --notes 'Update feed for the in-app updater (#1730). Updated by publish.yaml after each release; not a release itself.'
          fi
          gh release upload update-feed --repo "${GITHUB_REPOSITORY}" --clobber feed/*
